<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Tug-of-War — Authentication</title>
  <link rel="stylesheet" href="/frontend/styles/main.css" />
</head>
<body>

  <header class="app-header">
    <div class="logo">
      <div class="logo-icon"><span><span class="r">←</span><span class="s">∑</span><span class="b">→</span></span></div>
      <span class="logo-text">Math <span class="red">Tug</span><span class="yellow">-of-</span><span class="blue">War</span></span>
    </div>
    <nav class="nav-links">
      <a href="/frontend/index.html">Home</a>
      <a href="/frontend/pages/Play.html">Play</a>
      <a href="/frontend/pages/GameModes.html">Modes</a>
      <a href="/frontend/pages/Leaderboard.html">Leaderboard</a>
    </nav>
    <a href="javascript:void(0);" class="icon" onclick="myFunction()">&#9776;</a>
  </header>

  <main>
    <div class="auth-container">

      <div class="role-selector">
        <button class="role-btn active" data-role="teacher">Teacher</button>
        <button class="role-btn" data-role="student">Student</button>
      </div>

      <div id="teacherAuth" class="auth-section">
        <div class="auth-card">
          <div class="tabs" id="teacherTabs">
            <button class="active" data-tab="login">Log in</button>
            <button data-tab="signup">Sign up</button>
          </div>

          <!-- Teacher Login Form -->
          <div id="teacherLoginForm" class="form-container">
            <form id="teacherLogin">
              <div class="field">
                <label>Email</label>
                <input type="email" placeholder="you@school.ac.za" required>
              </div>
              <div class="field">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required>
              </div>
              <button type="submit" class="btn-submit">Log in</button>
            </form>
          </div>

          <!-- Teacher Signup Form -->
          <div id="teacherSignupForm" class="form-container">
            <form id="teacherSignup">
              <div class="field">
                <label>Full Name</label>
                <input type="text" placeholder="Alex Johnson" required>
              </div>
              <div class="field">
                <label>Email</label>
                <input type="email" placeholder="you@school.ac.za" required>
              </div>
              <div class="field">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required>
              </div>
              <button type="submit" class="btn-submit">Create account</button>
            </form>
          </div>
        </div>
      </div>

      <div id="studentAuth" class="auth-section">
        <div class="auth-card">
          <h1>Student <span class="blue">Sign In</span></h1>
          <p>Enter the code given by your teacher to join the game.</p>
          <form id="studentCodeForm">
            <div class="field">
              <label>Your unique code</label>
              <input type="text" placeholder="e.g. 7X9K2L" required>
            </div>
            <button type="submit" class="btn-submit">Sign in</button>
          </form>
          <div id="studentHelp">
            Don't have a code? Ask your teacher for one.
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="app-footer">
    <div class="container">
      <div class="footer-style">
        <div class="logo-icon">←∑→</div>
        <span>© 2026 Math Tug-of-War</span>
      </div>
      <div class="links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Support</a>
      </div>
    </div>
  </footer>

  <script src="/frontend/index.js"></script>
  <script src="/frontend/pages/Auth.js"></script>
</body>
</html>
